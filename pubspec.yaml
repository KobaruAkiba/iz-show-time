name: iz_show_time_tracker
description: A cross-platform mobile app to track films and TV shows with smart notifications.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Widgets
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Storage & Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  
  # Notifications
  flutter_local_notifications: ^16.0.0
  
  # Firebase - temporarily disabled to fix Windows build
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  
  # Utils
  uuid: ^4.2.1
  intl: ^0.18.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
