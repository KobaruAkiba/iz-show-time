name: iz_show_time_tracker
description: A cross-platform mobile app to track films and shows with smart notifications.

publish_to: 'none'

version: 2.2.1+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.9
  url_launcher: ^6.3.2
  file_selector: ^1.0.3
  share_plus: ^13.3.1
  flutter_file_dialog: ^3.0.2
  # Workaround: 2.6.0 FFI/`objective_c` crashes on iOS device Release
  # (Hive.initFlutter → path_provider). Revert after Flutter fixes #186794.
  path_provider_foundation: 2.5.1
  cached_network_image: ^4.0.3
  package_info_plus: ^10.2.2
  flutter_cache_manager: ^3.5.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/IzShowTimeIcon.png
  adaptive_icon_background: "#FDD408"
  adaptive_icon_foreground: assets/icons/IzShowTimeIcon.png
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: assets/icons/IzShowTimeIcon.png
    background_color: "#FDD408"
    theme_color: "#FDD408"
  windows:
    generate: true
    image_path: assets/icons/IzShowTimeIcon.png
    icon_size: 256

flutter_native_splash:
  color: "#000000"
  image: assets/images/splash/IzShowTimeLogoSplash.png
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/images/splash/IzShowTimeLogoSplashAndroid12.png

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Bundled so the app never downloads typefaces at runtime.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
