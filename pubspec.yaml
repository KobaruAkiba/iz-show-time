name: iz_show_time_tracker
description: A cross-platform mobile app to track films and shows with smart notifications.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.9
  url_launcher: ^6.3.2
  file_selector: ^1.0.3
  share_plus: ^10.0.2
  flutter_file_dialog: ^3.0.2
  # Workaround: 2.6.0 FFI/`objective_c` crashes on iOS device Release
  # (Hive.initFlutter → path_provider). Revert after Flutter fixes #186794.
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/IzShowTimeIcon.png
  adaptive_icon_background: "#FDD408"
  adaptive_icon_foreground: assets/icons/IzShowTimeIcon.png
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: assets/icons/IzShowTimeIcon.png
    background_color: "#FDD408"
    theme_color: "#FDD408"
  windows:
    generate: true
    image_path: assets/icons/IzShowTimeIcon.png
    icon_size: 256

flutter_native_splash:
  color: "#000000"
  image: assets/images/splash/IzShowTimeLogoSplash.png
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/images/splash/IzShowTimeLogoSplashAndroid12.png

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
