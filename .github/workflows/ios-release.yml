# Build a signed iOS IPA on macOS runners and upload it to TestFlight.
#
# Required GitHub secrets — see the workflow summary / README steps in chat:
#   TMDB_API_KEY
#   APPLE_TEAM_ID
#   BUILD_CERTIFICATE_BASE64
#   P12_PASSWORD
#   BUILD_PROVISION_PROFILE_BASE64
#   KEYCHAIN_PASSWORD
#   PROVISIONING_PROFILE_NAME
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_PRIVATE_KEY

name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the IPA to TestFlight after building
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & upload IPA
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.izshowtime.tracker
      FLUTTER_VERSION: '3.44.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # workmanager_apple uses BGContinuedProcessingTask (iOS 26 SDK).
      # macOS 15 defaults to Xcode 16.4, which cannot compile that API.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"
          echo "Installed provisioning profile UUID=$PP_UUID"

      - name: Write ExportOptions.plist
        env:
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_PLIST=ios/ExportOptions.plist
          rm -f "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${BUNDLE_ID} string ${PROVISIONING_PROFILE_NAME}" "$EXPORT_PLIST"
          plutil -lint "$EXPORT_PLIST"
          cat "$EXPORT_PLIST"

      - name: Configure code signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          # flutter build ipa does not forward args after "--" to xcodebuild;
          # inject signing settings into the Flutter release xcconfig instead.
          for XCCONFIG in ios/Flutter/Release.xcconfig ios/Flutter/Profile.xcconfig; do
            if [[ -f "$XCCONFIG" ]]; then
              printf '%s\n' \
                "DEVELOPMENT_TEAM=${APPLE_TEAM_ID}" \
                "CODE_SIGN_STYLE=Manual" \
                "CODE_SIGN_IDENTITY=Apple Distribution" \
                "PROVISIONING_PROFILE_SPECIFIER=${PROVISIONING_PROFILE_NAME}" \
                >> "$XCCONFIG"
              echo "Updated $XCCONFIG:"
              cat "$XCCONFIG"
            fi
          done

      - name: Build IPA
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-number="${{ github.run_number }}" \
            --dart-define="TMDB_API_KEY=${TMDB_API_KEY}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: izshowtime-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA_PATH"

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$KEY_PATH"

          # API keys for altool / Transporter live in ~/private_keys or ~/.appstoreconnect/private_keys
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
